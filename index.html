<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f6f1e4">
  <title>Cruzadas do Dia</title>
  <!-- ?v=N evita o navegador misturar arquivos novos com antigos em cache.
       Aumente N (aqui e nos imports de js/app.js) a cada mudança de JS/CSS,
       até o service worker da Etapa 4 assumir o controle de versões. -->
  <link rel="stylesheet" href="css/estilo.css?v=2">
  <script type="module" src="js/app.js?v=2"></script>
</head>
<body>
  <header class="cabecalho">
    <h1 class="nome">Cruzadas do Dia</h1>
    <p class="data" id="data-extenso"></p>
    <p class="edicao" id="edicao"></p>
  </header>

  <p class="aviso" id="aviso" hidden></p>

  <main class="folha" id="folha">
    <div class="grade" id="grade" aria-label="Grade"></div>
  </main>
</body>
</html>
