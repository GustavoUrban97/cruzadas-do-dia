name: Validar puzzles

on:
  push:
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar puzzles e regenerar index.json
        run: python3 tools/validar.py

      - name: Conferir se index.json está atualizado
        run: |
          if ! git diff --exit-code puzzles/index.json; then
            echo "::error::puzzles/index.json está desatualizado. Rode python3 tools/validar.py e faça commit."
            exit 1
          fi
